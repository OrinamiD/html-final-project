<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Prescripto</title>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <div>
            <img class="logo" src="./images/logo-prescripto.png" alt="" />
          </div>

          <div class="nav">
            <li>Home</li>
            <li>All Doctors</li>
            <li>About</li>
            <li>Contact</li>
          </div>
          <div>
            <button class="btn" type="submit">Create account</button>
          </div>
        </ul>
      </nav>
    </header>

    <section class="first-section">
      <div class="container">
        <div class="left">
          <h2>Book Appointment With Trusted Doctors</h2>
          <div class="new">
            <div>
              <img class="head" src="./images/group_profiles (1).png" alt="" />
            </div>
            <div>
              <p>
                Simply browse through our extensive list of trusted doctors,
                schedule your appointment hassle-free.
              </p>
            </div>
          </div>
          <div>
            <button class="btn1">
              Book appointment <img src="./images/arrow_icon (1).svg" alt="" />
            </button>
          </div>
        </div>

        <div class="right">
          <img class="img" src="./images/doc-header-img (1).png" alt="" />
        </div>
      </div>
    </section>
  </body>
</html>
